      <text x="570" y="170" text-anchor="middle" font-size="11" fill="#4a5568">子串匹配 objects + task_history + env_profile</text>

      <text x="570" y="257" text-anchor="middle" font-size="11" fill="#4a5568">max_tokens=2048, temp=0.3 → task_understanding + steps[]</text>

      <text x="452" y="537" text-anchor="middle" font-size="9.5" fill="#4a5568">conf≥0.7 实时写 semantic_map</text>

      <!-- 4e: fail path -->

      <text x="687" y="522" text-anchor="middle" font-size="10.5" font-weight="600" fill="#a82a2a">失败 → 同参 retry ≤1 → replan ≤2</text>
      <text x="687" y="537" text-anchor="middle" font-size="9.5" fill="#4a5568">确定性失败(解析/odom)跳过 retry 直接重规划</text>

      <!-- 4f: replan detail -->
      <rect x="345" y="560" width="450" height="40" rx="6" fill="#e8f0fe" stroke="#2b6cb0"/>
      <text x="570" y="578" text-anchor="middle" font-size="10.5" fill="#1a4480">Planner.replan: 已完成步骤 + 失败原因 + 工作记忆 + 最新位姿</text>
      <text x="570" y="592" text-anchor="middle" font-size="9.5" fill="#6b7785">替换失败步骤及之后所有步骤，i 不变继续执行</text>
    </g>

    <!-- Step 5: write memory -->
